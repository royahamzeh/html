<!DOCTYPE html>
<html>
<head>
    <title>Send Order</title>
</head>

<body>
    <h1>Submit Your Order</h1>

    <label>Name:</label>
    <input id="nameInput" type="text"> <br><br>

    <label>Package ID:</label>
    <input id="packageInput" type="text"> <br><br>

    <label>Address:</label>
    <input id="addressInput" type="text"> <br><br>

    <button id="sendButton">Submit Order</button>

    <p id="responseBox"></p>

    <script>
        document.getElementById("sendButton").addEventListener("click", function() {

            const payload = {
                name: document.getElementById("nameInput").value,
                packageId: document.getElementById("packageInput").value,
                address: document.getElementById("addressInput").value
            };

            // ✅ مسیر درست فانکشن
            const apiUrl = "https://v9y7wohmqk.execute-api.eu-west-1.amazonaws.com/default/RoyaFunction-savingorder";

            fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                // اگر پاسخ JSON بود
                if (response.ok) {
                    return response.json();
                } else {
                    return response.text().then(text => {
                        throw new Error("HTTP " + response.status + ": " + text);
                    });
                }
            })
            .then(data => {
                document.getElementById("responseBox").innerText =
                    "Response from Lambda: " + JSON.stringify(data);
            })
            .catch(error => {
                document.getElementById("responseBox").innerText =
                    "Error: " + error;
            });
        });
    </script>
</body>
</html>
